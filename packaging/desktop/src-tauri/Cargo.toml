[package]
name = "kohakuterrarium-desktop"
version = "0.0.0"
description = "KohakuTerrarium desktop shell"
authors = ["Shih-Ying Yeh (KohakuBlueLeaf)"]
edition = "2021"
publish = false

[lib]
name = "kohakuterrarium_desktop"
crate-type = ["rlib"]

[[bin]]
name = "kohakuterrarium"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
