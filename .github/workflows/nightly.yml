name: Nightly

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Build even if this commit is already in the nightly manifest"
        required: false
        default: false
        type: boolean

# Serialised and never cancelled: a second run has to see what the first
# published, or both decide the same commit is unbuilt.
concurrency:
  group: nightly
  cancel-in-progress: false

# Decides only. Release is the sole workflow that builds or uploads, so PyPI
# needs exactly one trusted publisher and there is one build matrix to
# maintain instead of two that drift.
permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch previous nightly manifest
        shell: bash
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/manifests-nightly/nightly.json" \
            -o previous-nightly.json || echo "no previous manifest"

      - name: Decide whether a nightly is due
        id: gate
        shell: bash
        run: |
          python scripts/nightly_gate.py \
            --manifest previous-nightly.json \
            --commit-sha "$(git rev-parse HEAD)" \
            --force-rebuild "${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true || false }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report skipped nightly
        if: steps.gate.outputs.should_build != 'true'
        run: echo "${{ steps.gate.outputs.skip_reason }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Computed after the gate so the stamp names the moment of the build.
      - name: Compute the nightly version
        id: compute
        if: steps.gate.outputs.should_build == 'true'
        shell: bash
        run: |
          version=$(python scripts/set_pyproject_version.py nightly)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "nightly ${version}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the release workflow
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            -R "${GITHUB_REPOSITORY}" \
            -f ref=main \
            -f version="${{ steps.compute.outputs.version }}" \
            -f channel=nightly
