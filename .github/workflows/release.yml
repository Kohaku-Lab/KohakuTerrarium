name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or sha to build"
        required: false
        default: ""
      version:
        description: "Stamp this version before building (nightlies pass X.Y.Z.devN)"
        required: false
        default: ""
      channel:
        description: "Channel to publish (override)"
        required: false
        default: "stable"
        type: choice
        options: [stable, beta, nightly]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # ── One resolution of version / channel / tag, consumed by every job ──
  # This is the only workflow that builds or uploads, so PyPI needs exactly
  # one trusted publisher. Nightly decides and dispatches; it builds nothing.
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.m.outputs.ref }}
      version: ${{ steps.m.outputs.version }}
      channel: ${{ steps.m.outputs.channel }}
      tag: ${{ steps.m.outputs.tag }}
      title: ${{ steps.m.outputs.title }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      stamp: ${{ steps.m.outputs.stamp }}
      sha: ${{ steps.m.outputs.sha }}
      keep_nightlies: ${{ steps.m.outputs.keep_nightlies }}
      max_releases: ${{ steps.m.outputs.max_releases }}
      build_id: ${{ steps.m.outputs.build_id }}
      notes_since: ${{ steps.m.outputs.notes_since }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve release metadata
        id: m
        shell: bash
        run: |
          ref="${{ inputs.ref }}"
          [ -n "${ref}" ] || ref="${GITHUB_REF}"

          # A dispatched version wins; a tag push carries its own; otherwise
          # pyproject is the source of truth.
          version="${{ inputs.version }}"
          stamp=true
          if [ -z "${version}" ]; then
            stamp=false
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version=$(python scripts/set_pyproject_version.py read)
            fi
          fi

          channel="${{ inputs.channel }}"
          if [ -z "${channel}" ]; then
            case "${GITHUB_REF_NAME}" in
              *b*|*rc*) channel="beta" ;;
              *) channel="stable" ;;
            esac
          fi

          # A nightly is dated, not versioned: the tag names the day it was
          # cut so the launcher's URLs stay predictable and prunable.
          if [ "${channel}" = "nightly" ]; then
            date=$(date -u +%Y%m%d)
            tag="nightly-${date}"
            title="Nightly ${date}"
            prerelease=true
            keep_nightlies=5
            max_releases=5
          else
            tag="v${version}"
            title="v${version}"
            case "${version}" in
              *dev*|*rc*|*a*|*b*) prerelease=true ;;
              *) prerelease=false ;;
            esac
            # A formal release supersedes the nightly backlog. A manual
            # dispatch is not a release and prunes nothing.
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              keep_nightlies=1
            else
              keep_nightlies=""
            fi
            max_releases=""
          fi

          notes_since="auto"
          if [ "${channel}" = "nightly" ]; then
            if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/manifests-nightly/nightly.json" -o previous-nightly.json; then
              notes_since=$(jq -r '.releases[0].commit_sha // "auto"' previous-nightly.json)
            fi
            [ -n "${notes_since}" ] || notes_since="auto"
          fi

          {
            echo "ref=${ref}"
            echo "build_id=$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=7 HEAD)"
            echo "notes_since=${notes_since}"
            echo "version=${version}"
            echo "channel=${channel}"
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
            echo "stamp=${stamp}"
            echo "sha=$(git rev-parse HEAD)"
            echo "keep_nightlies=${keep_nightlies}"
            echo "max_releases=${max_releases}"
          } >> "$GITHUB_OUTPUT"

          echo "${title} (channel=${channel} tag=${tag} prerelease=${prerelease})" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Wheel + sdist (PyPI source-of-truth, unchanged) ────────────────
  build-wheel:
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp the dispatched version
        if: needs.meta.outputs.stamp == 'true'
        run: python scripts/set_pyproject_version.py write "${{ needs.meta.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: src/kohakuterrarium-frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend build output
        shell: bash
        run: |
          test -f src/kohakuterrarium/web_dist/index.html

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Verify built wheel install
        shell: bash
        run: |
          python -m venv .venv-wheel-test
          source .venv-wheel-test/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          kt --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Per-(platform, py_abi) release-tree tarballs ───────────────────
  # 06b/Phase H: each cell runs scripts/build_release_tree.py, producing
  # one ``kohakuterrarium-<v>-<plat>-py<X.Y>.tar.zst`` + sidecar manifest.
  # The launcher's downloader consumes these directly.
  #
  # cp313 only: briefcase bundles cp313 on Win/macOS, so the launcher
  # only ever fetches cp313 trees. Earlier cp311/cp312 cells were built
  # for hypothetical "user runs the launcher on their own Python"
  # consumers; pip-installed users update via PyPI and docker users
  # update via ``docker pull`` — neither uses launcher tarballs.
  # The Linux cell is kept for advanced users running the launcher on
  # their own Linux Python.
  build-release-tree:
    needs: [meta, build-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: "3.13"
            abi: cp313
            plat: linux-x64
          - os: macos-latest
            py: "3.13"
            abi: cp313
            plat: macos-arm64
          - os: windows-latest
            py: "3.13"
            abi: cp313
            plat: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Stamp the dispatched version
        if: needs.meta.outputs.stamp == 'true'
        run: python scripts/set_pyproject_version.py write "${{ needs.meta.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: src/kohakuterrarium-frontend
        run: |
          npm ci
          npm run build

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install zstandard

      - name: Build release tree
        shell: bash
        run: |
          python scripts/build_release_tree.py \
            --version "${{ needs.meta.outputs.version }}" \
            --build-id "${{ needs.meta.outputs.build_id }}" \
            --commit-sha "${{ needs.meta.outputs.sha }}" \
            --platform "${{ matrix.plat }}" \
            --py-abi "${{ matrix.abi }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --out dist/release-trees/

      - uses: actions/upload-artifact@v4
        with:
          name: release-tree-${{ matrix.plat }}-${{ matrix.abi }}
          path: dist/release-trees/

  # ── Aggregate sidecars into channel manifests ─────────────────────
  publish-channel-manifests:
    needs: [meta, build-release-tree]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Filter to ONLY the release-tree artifacts — the dist wheel job
      # and docker job upload their own artifacts to the same run, and
      # downloading 16MB of wheels + 100KB of dockerbuild metadata is
      # both wasted bandwidth and a reliability hit when the run holds
      # many artifacts in flight.
      - uses: actions/download-artifact@v4
        with:
          path: tarballs
          pattern: release-tree-*
          merge-multiple: true

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-trees
          find tarballs -type f \( -name "*.tar.zst" -o -name "*.manifest.json" \) -exec cp {} release-trees/ \;
          ls -la release-trees/

      - name: Fetch previous channel manifest (if any)
        shell: bash
        run: |
          channel="${{ needs.meta.outputs.channel }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/manifests-${channel}/${channel}.json"
          curl -fsSL "${url}" -o "previous-${channel}.json" || echo "no previous manifest"

      - name: Build channel manifest
        shell: bash
        run: |
          channel="${{ needs.meta.outputs.channel }}"
          tag="${{ needs.meta.outputs.tag }}"
          # Nightly entries are bounded to match the prune below: a manifest
          # entry must never outlive the release its URLs point at.
          max_releases=""
          if [ -n "${{ needs.meta.outputs.max_releases }}" ]; then
            max_releases="--max-releases ${{ needs.meta.outputs.max_releases }}"
          fi
          # shellcheck disable=SC2086
          python scripts/publish_manifest.py \
            --channel "${channel}" \
            --release-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            --artifacts-dir release-trees/ \
            --previous-manifest "previous-${channel}.json" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            ${max_releases} \
            --out "${channel}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: channel-manifest
          path: ${{ needs.meta.outputs.channel }}.json

      - name: Publish manifest to manifests-<channel> release
        # Overwrites the asset on the fixed-tag release so the launcher's
        # canonical URL stays stable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          channel="${{ needs.meta.outputs.channel }}"
          tag="manifests-${channel}"
          if ! gh release view "${tag}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "Channel manifest: ${channel}" \
              --notes "Auto-updated channel manifest for ${channel}. Do not delete." \
              --prerelease \
              -R "${GITHUB_REPOSITORY}"
          fi
          gh release upload "${tag}" "${channel}.json" \
            --clobber \
            -R "${GITHUB_REPOSITORY}"

  # ── Briefcase desktop shell (slim — bundles ONE release-tree as fallback) ─
  build-desktop:
    needs: [meta, build-wheel, build-release-tree]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            plat_tag: win-x64
            abi: cp313
            py: "3.13"
          - os: macos-latest
            platform: macOS
            plat_tag: macos-arm64
            abi: cp313
            py: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Stamp the dispatched version
        if: needs.meta.outputs.stamp == 'true'
        run: python scripts/set_pyproject_version.py write "${{ needs.meta.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: src/kohakuterrarium-frontend
        run: |
          npm ci
          npm run build

      - uses: actions/download-artifact@v4
        with:
          name: release-tree-${{ matrix.plat_tag }}-${{ matrix.abi }}
          path: bundled-release/

      - name: Verify bundled-release has the right tarball
        shell: bash
        run: |
          ls -la bundled-release/
          test -n "$(find bundled-release -maxdepth 1 -name 'kohakuterrarium-*.tar.*' | head -n 1)"

      - name: Install briefcase
        run: pip install briefcase

      - name: Pre-build wheels for sdist-only deps
        shell: bash
        run: |
          mkdir -p wheels
          pip wheel proxy_tools -w wheels --no-deps

      # ``KohakuTerrarium[desktop]`` would otherwise resolve from PyPI — which
      # at this point still serves the PREVIOUS release, since publish-pypi
      # runs in parallel with this job.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: wheel-dist/

      - name: Stage the release wheel for briefcase
        shell: bash
        run: |
          find wheel-dist -maxdepth 1 -name "*.whl" -exec cp {} wheels/ \;
          python scripts/pin_briefcase_local_wheel.py --wheel-dir wheels
          ls -la wheels/

      - name: Create briefcase project
        run: briefcase create

      - name: Build briefcase app
        run: briefcase build

      - name: Package briefcase app
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            briefcase package --adhoc-sign
          else
            briefcase package
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/*.msi artifacts/ 2>/dev/null || true
          cp dist/*.dmg artifacts/ 2>/dev/null || true
          cp dist/*.zip artifacts/ 2>/dev/null || true
          find dist/ -maxdepth 1 -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.app" \) -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/
          test -n "$(find artifacts -maxdepth 1 -type f | head -n 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: artifacts/

  # ── Docker images (unchanged) ──────────────────────────────────────
  build-docker:
    needs: [meta, build-wheel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - target: all
            dockerfile: docker/Dockerfile.all
            suffix: ""
          - target: host
            dockerfile: docker/Dockerfile.host
            suffix: "-host"
          - target: client
            dockerfile: docker/Dockerfile.client
            suffix: "-client"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kohakuterrarium${{ matrix.image.suffix }}"
          version="${{ needs.meta.outputs.version }}"
          # :latest means the newest stable image. A nightly that moved it
          # would silently become what `docker pull` hands every user.
          {
            echo "repo=${repo}"
            echo "version=${version}"
            echo "tags<<__TAGS__"
            echo "${repo}:${version}"
            if [ "${{ needs.meta.outputs.channel }}" = "stable" ]; then
              echo "${repo}:latest"
            fi
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            WHEEL_GLOB=dist/kohakuterrarium-*.whl

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.tags.outputs.repo }}@${DIGEST}"

  # ── PyPI publish (unchanged) ───────────────────────────────────────
  publish-pypi:
    needs: [meta, build-wheel]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release (release-tree tarballs + briefcase artifacts) ──
  github-release:
    needs: [meta, build-wheel, build-release-tree, build-desktop, publish-channel-manifests]
    runs-on: ubuntu-latest
    steps:
      # Checkout first: the action cleans its destination directory, which
      # would wipe the downloaded artifacts if it ran after them.  Full
      # history so the notes can list commits back to the previous release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pull only artifacts we actually publish to the release.  The
      # ``Kohaku-Lab~*~*.dockerbuild`` blobs from the docker job are
      # heavy provenance metadata we don't need here.
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: dist
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: release-tree-*
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: desktop-*

      - name: Collect release assets
        run: |
          mkdir release
          # Wheels + sdists
          find all-artifacts/dist -type f -exec cp {} release/ \;
          # Release-tree tarballs + sidecars
          find all-artifacts/release-tree-* -type f -exec cp {} release/ \;
          # Briefcase desktop bundles
          find all-artifacts/desktop-* -type f -exec cp {} release/ \;
          ls -la release/

      # A plain commit list beats ``generate_release_notes``: that groups by
      # pull request, so direct pushes vanish and a branch collapses to one
      # line regardless of how much landed in it.
      - name: Build release notes
        shell: bash
        run: |
          # Resolved in `meta`, before the nightly manifest is overwritten.
          since="${{ needs.meta.outputs.notes_since }}"
          intro=()
          if [ "${{ needs.meta.outputs.channel }}" = "nightly" ]; then
            intro=(--intro "Automatic nightly build. Channel: \`nightly\`. Version: \`${{ needs.meta.outputs.version }}\`.")
          fi
          python scripts/release_notes.py \
            --since "${since}" \
            --until "${{ needs.meta.outputs.sha }}" \
            --github-repo "${GITHUB_REPOSITORY}" \
            "${intro[@]}" \
            --out release-notes.md
          cat release-notes.md

      # A dated nightly re-run overwrites its own release rather than
      # failing on the existing tag.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          files: release/*
          body_path: release-notes.md
          draft: false
          # PEP 440 pre-release identifiers: alpha, beta, rc and dev all
          # publish as prereleases, so a v2.0.0.dev6 never shows up as
          # "Latest" on the release page. Resolved once, in ``meta``.
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}

      - name: Prune old nightly releases
        if: needs.meta.outputs.keep_nightlies != ''
        # Nightlies keep the newest 5, matching the manifest's --max-releases:
        # an entry must never outlive the release its URLs point at. A formal
        # release supersedes the backlog and keeps only 1.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          keep="${{ needs.meta.outputs.keep_nightlies }}"
          tags=$(gh release list -R "${GITHUB_REPOSITORY}" --limit 1000 \
            --json tagName --jq '.[].tagName' \
            | { grep -E '^nightly-[0-9]{8}$' || true; } | sort -r)
          echo "${tags}" | tail -n +$((keep + 1)) | while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "pruning ${tag}"
            gh release delete "${tag}" --cleanup-tag --yes -R "${GITHUB_REPOSITORY}"
          done
