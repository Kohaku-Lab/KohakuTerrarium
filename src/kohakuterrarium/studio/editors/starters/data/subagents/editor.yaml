label: Make a change
summary: A helper the creature hands a task to; it can read and edit files.
order: 10
form:
  description: Carries out one well-defined change in the working directory.
  tools: [read, glob, grep, write, edit]
  can_modify: true
  stateless: true
  system_prompt: |
    You carry out one well-defined change in the working directory. Read
    before you edit, change only what the task asks, and reply with what you
    changed and where.
