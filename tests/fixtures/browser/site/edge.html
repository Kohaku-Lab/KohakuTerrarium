<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge cases fixture</title>
</head>
<body>
<p>Time: 10:30 today</p>
<p>key: value pair</p>
<p>hash # inside</p>
<p>[bracket start</p>
<p>42</p>
<p>yes</p>
<p>'single quoted'</p>
<p>"double quoted"</p>
<p>back\slash and tab&#9;here</p>
<p>Unicode: caf&eacute; &#x1F600; &#x4E2D;&#x6587;</p>
<button type="button" aria-label="Label: with colon">A</button>
<button type="button" aria-label="It's &quot;quoted&quot;">B</button>
<button type="button" aria-label="line one&#10;line two">C</button>
<a href="/path?a=1&amp;b=two words#frag">Link with query</a>
<input aria-label="Count" type="number" value="7">
<input aria-label="Volume" type="range" value="30">
<div role="switch" aria-checked="true" tabindex="0" aria-label="Wifi">on</div>
<div role="tablist"><div role="tab" aria-selected="true" tabindex="0">Tab one</div><div role="tab" aria-selected="false" tabindex="-1">Tab two</div></div>
<details open><summary>More info</summary><p>Details body</p></details>
<div role="dialog" aria-label="Notice"><p>Dialog text</p><button type="button">OK</button></div>
<img alt="Logo image" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
</body>
</html>
