[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KohakuTerrarium"
version = "2.1.1"
description = "A universal agent framework for building self-driven AI agents and multi-agent teams"
authors = [
    { name = "Shih-Ying Yeh (KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
# Custom license; SPDX LicenseRef- form is required by Briefcase 0.3.21+.
license = "LicenseRef-KohakuTerrarium-1.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agent", "llm", "multi-agent", "terrarium", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core
    "httpx>=0.27.0",
    "openai>=2.0.0",
    "anthropic>=0.68.0",
    # Pinned <2.13 to match the pydantic-core Android wheel we ship.
    "pydantic>=2.12.0,<2.13",
    # Direct dep (transitive of pydantic) so the Android build emits a wheel
    # URL ref for it. Same reason for jiter / rpds-py / safetensors /
    # tokenizers / primp below (all Rust/PyO3, no Chaquopy wheel).
    "pydantic-core>=2.41.0,<2.42",
    "rich>=14.0.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0.0",
    "ruamel.yaml>=0.18.0",
    "jinja2>=3.1.0",
    # Wide pin: PyPI 1.x on desktop, Chaquopy's 0.3.23 on Android; the cst.*
    # API our codegen uses is stable across both.
    "libcst>=0.3.23,<2",
    "aiofiles>=25.1.0",
    "python-dotenv>=1.0.0",
    # >=0.8.6 for PEP 738 Android wheel tags + the relaxed numpy>=1.26 floor
    # (Chaquopy compat). The floor here drives the Android wheel URL ref.
    "kohakuvault>=0.8.6",
    "textual>=8.0.0",
    "html2text>=2025.0.0",
    "gitpython>=3.1.0",
    # Pure-Python git fallback for `kt install <url>` where no `git` binary
    # exists (e.g. Android).
    "dulwich>=0.22",
    # API server
    "fastapi>=0.115.0",
    # [standard] (uvloop/httptools/watchfiles) is stripped on Android by
    # packaging/android/postcreate.py; pip installs get the full set.
    "uvicorn[standard]>=0.34.0",
    "websockets>=10.4",
    # API auth (L4 multi-user accounts); used only under api/auth/.
    "bcrypt>=4.0.0",
    # QR codes for `kt admin show-host-qr` (tiny, no PIL transitive).
    "segno>=1.6.0",
    # Web tools
    "trafilatura>=2.0.0",
    "ddgs>=9.0.0",
    # PDF reading; stripped on Android by postcreate.py (no Chaquopy wheel,
    # consumers lazy-import so absence degrades gracefully).
    "pymupdf>=1.24.0",
    # >=11 floor for Chaquopy (Android) compat; the Image API we use is stable.
    "Pillow>=11.0.0",
    # MCP 2.x removed APIs used by the current client integration.
    "mcp>=1.0.0,<2",
    # Direct dep for the Android wheel URL ref (transitive via mcp).
    "rpds-py>=0.30.0",
    # Direct dep for the Android wheel URL ref (transitive via openai/anthropic).
    "jiter>=0.10.0,<1",
    # Direct dep for the Android wheel URL ref (transitive via ddgs).
    "primp>=1.3.0",
    # Lightweight embeddings (no pytorch)
    "model2vec>=0.8.0",
    # Direct deps for the Android wheel URL refs (transitive via model2vec).
    # tokenizers capped <0.24 so the [full] extra's sentence-transformers
    # stays solvable.
    "safetensors>=0.7.0",
    "tokenizers>=0.20,<0.24",
    # Windows PTY for the terminal panel.
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Kohaku-Lab/KohakuTerrarium"
Repository = "https://github.com/Kohaku-Lab/KohakuTerrarium"
Documentation = "https://github.com/Kohaku-Lab/KohakuTerrarium/tree/main/docs"
Issues = "https://github.com/Kohaku-Lab/KohakuTerrarium/issues"

[project.scripts]
kt = "kohakuterrarium.__main__:main"
# Standalone interactive front doors (== `kt run <creature> --mode cli|tui`,
# with an optional creature arg → startup picker).
kt-cli = "kohakuterrarium.cli.entry_cli:main"
kt-tui = "kohakuterrarium.cli.entry_tui:main"
# Spawns a lab-host + embedded lab-client in one process (Docker entrypoint /
# systemd unit).
kt-aio = "kohakuterrarium.cli._aio_entrypoint:run"

[project.optional-dependencies]
# No extra deps; named so `pip install kohakuterrarium[host]` / `[client]`
# resolve against the same wheel.
host = []
client = []

# pywebview shell for desktop bundles. Kept out of core deps so the Android
# build (native WebView) doesn't try to install it.
desktop = [
    "pywebview==6.2.1",
]

discord = [
    "discord.py>=2.0.0",
]
demo = [
    "KohakuTerrarium[discord]",
]

# 100+ LLM providers via a unified SDK.
litellm = [
    "litellm>=1.60.0,<2.0.0",
]

# Full browser rendering for web_fetch (heavy: lxml).
browser = [
    "crawl4ai>=0.8.0",
]

# Everything, including pytorch-based embeddings.
embeddings-heavy = [
    "sentence-transformers>=5.0.0",
]
full = [
    "KohakuTerrarium[demo,browser,embeddings-heavy,desktop,litellm]",
]

# Testing and linting.
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.0",
    # Starlette 1.2+ uses HTTPX2 for TestClient and deprecates the HTTPX fallback.
    "httpx2>=2.0.0",
    "black>=26.3.0",
    "isort>=8.0.0",
    "ruff>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["kohakuterrarium*"]
exclude = ["kohakuterrarium-frontend*"]

[tool.setuptools.package-data]
"kohakuterrarium.builtin_skills" = ["**/*.md"]
"kohakuterrarium.builtins.subagents" = ["*.md"]
"kohakuterrarium.studio.editors" = ["templates_data/*.j2"]
"kohakuterrarium.packaging.systemd" = ["*.template"]
"kohakuterrarium" = ["web_dist/**/*", "app_icons/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
# 60s per-test cap: a safety net for deadlocks. e2e/multi-node journeys need
# the headroom on loaded CI workers; override per-test via @pytest.mark.timeout.
timeout = 60
timeout_method = "thread"

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.briefcase]
project_name = "KohakuTerrarium"
bundle = "com.kohaku.terrarium"
version = "2.1.1"
url = "https://github.com/Kohaku-Lab/KohakuTerrarium"
author = "Shih-Ying Yeh (KohakuBlueLeaf)"
author_email = "apolloyeh0123@gmail.com"

[tool.briefcase.app.kohakuterrarium]
formal_name = "KohakuTerrarium"
description = "Universal Agent Framework - Desktop App"
icon = "src/kohakuterrarium/app_icons/app"
# Parent sources are the wrapper package only. `bundled-release/` (the 06b
# release-tarball mechanism) is desktop-only, so it's added per-platform below;
# Briefcase merges platform sources into the parent set.
sources = ["src/kohakuterrarium"]
startup_module = "kohakuterrarium.__briefcase__"
# Launcher-only deps: no pip/venv/ensurepip (those are unavailable on the
# Windows briefcase shell). pywebview = splash UI; zstandard = tarball decomp.
requires = [
    "packaging>=26.0",
    "pywebview==6.2.1",
    "zstandard>=0.22",
]
# proxy_tools (a pywebview dep) is sdist-only on PyPI — pre-built into wheels/ by CI.
requirement_installer_args = ["--find-links", "wheels"]

[tool.briefcase.app.kohakuterrarium.macOS]
universal_build = false
# 06b release-tarball dir the launcher reads on first boot (per-platform so
# Android doesn't inherit it).
sources = ["bundled-release"]
requires = [
    "std-nslog~=1.0.0",
    # pywebview shell via [desktop]; Android uses a native WebView instead.
    "KohakuTerrarium[desktop]",
]

[tool.briefcase.app.kohakuterrarium.windows]
sources = ["bundled-release"]
requires = [
    "KohakuTerrarium[desktop]",
]

[tool.briefcase.app.kohakuterrarium.linux]
sources = ["bundled-release"]
requires = [
    "KohakuTerrarium[desktop]",
]

# ── Android (Briefcase APK / AAB) ─────────────────────────────────────
# Ships the framework wheel + deps (from [project] above, wheeled by
# Chaquopy), the Vue web_dist, and a per-ABI busybox for the bash tool.
# Custom Java (MainActivity + KohakuHostService) and the busybox are copied
# in by packaging/android/postcreate.py after `briefcase create android`.
[tool.briefcase.app.kohakuterrarium.android]
# No sources/requires overrides: deps come from [project], no Android-only extras.
requires = []

# Pinned to Briefcase's own defaults (it warns when unset). See
# https://briefcase.readthedocs.io/en/stable/reference/platforms/android/gradle.html
build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.6.1",
    "androidx.constraintlayout:constraintlayout:2.1.4",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
]
# minSdk 26 (Android 8.0): MainActivity uses APIs (Files.readAllBytes,
# String.join, startForegroundService) that need 26 without desugaring.
min_os_version = "26"
# targetSdk/compileSdk 35 (Android 15): the Briefcase template references an
# API-35 attribute, and 35 is the Play Store baseline for new uploads.
target_os_version = "35"
# Version code encodes <major><minor:02><patch:02><build:03>:
# 2.1.0 build 0 -> 2_01_00_000.
version_code = "20101000"
# arm64-v8a only — covers ~99% of physical devices; x86_64 also tripped a
# Chaquopy cross-ABI URL-ref resolution quirk.
android_abis = ["arm64-v8a"]
# Foreground-service + camera + notification permissions (incl. the Android 14+
# foreground-service-type sub-permission).
android_manifest_extra_content = """
<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
<uses-permission android:name="android.permission.CAMERA" />
<uses-feature android:name="android.hardware.camera" android:required="false" />
"""
# Fully-qualified class name required: Briefcase's generated applicationId
# differs from our org.kohaku.terrarium namespace, so a relative `.` name
# wouldn't resolve.
android_manifest_application_extra_content = """
<service
    android:name="org.kohaku.terrarium.KohakuHostService"
    android:exported="false"
    android:foregroundServiceType="dataSync" />
"""
# ktconnect:// deep-link intent filter on the main activity.
android_manifest_activity_extra_content = """
<intent-filter android:autoVerify="false">
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <category android:name="android.intent.category.BROWSABLE" />
    <data android:scheme="ktconnect" />
</intent-filter>
"""
# singleTop so a ktconnect:// link re-enters the running activity via
# onNewIntent instead of starting a second Python boot.
android_manifest_activity_attrs_extra_content = """
android:launchMode="singleTop"
"""
# Cleartext for 127.0.0.1 (loopback has no TLS). allowBackup is flipped to
# false by postcreate.py instead (the template already emits it).
android_manifest_application_attrs_extra_content = """
android:usesCleartextTraffic="true"
"""
